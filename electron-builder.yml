appId: com.electron.app
productName: Arthwind Suite
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Pasta de referência/calibração (fotos de pás, PDFs, dados de turbina) que nunca
  # deveria ter ido pro instalador — 243MB, foi o motivo real do salto de tamanho
  # entre v1.5.2 e v1.5.3 (não foi o Playwright). Só precisa existir localmente pra
  # quem estiver calibrando, não dentro do app empacotado.
  - '!_bruteforce_review/**'
  - '!_bruteforce_review'
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/**
  # Chromium do Playwright, instalado em node_modules em vez do cache global do
  # usuário (%LOCALAPPDATA%/ms-playwright) — é o que faz a automação SNOW não
  # depender de "npx playwright install" na máquina de quem recebe o instalador.
  # Executável não roda de dentro do asar, por isso o unpack (mesmo motivo do
  # sharp acima). Só o chromium normal (headed E headless usam o mesmo binário) —
  # chromium_headless_shell foi removido antes do build por não ser usado.
  - node_modules/playwright-core/.local-browsers/**
win:
  executableName: arthwind-suite-ts
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
